services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: ${HERMES_CONTAINER_NAME:-gasken-hermes}
    restart: unless-stopped
    # Mode host memberikan performa maksimal 0 ms & akses langsung ke 9router (127.0.0.1:20128)
    network_mode: "host"
    environment:
      # Terhubung langsung ke 9router di localhost
      - OPENAI_BASE_URL=http://127.0.0.1:${NINEROUTER_PORT:-20128}/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-9router-local}
      - MODEL=${HERMES_MODEL:-hermes-3-llama-3.1-8b}
    volumes:
      # Persistensi data internal & sesi Hermes
      - ./data:/opt/data
      - ./workspace:/opt/workspace
      # Mount workspace GaskenLE agar agent bisa langsung bekerja pada file proyek
      - ../:/workspace:rw
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 300
    command: gateway run
