services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: ${HERMES_CONTAINER_NAME:-gasken-hermes}
    restart: unless-stopped
    ports:
      # Port lokal Hermes Gateway
      - "127.0.0.1:${HERMES_PORT:-6666}:8642"
    environment:
      # Terhubung langsung ke 9router Gateway via host gateway
      - OPENAI_BASE_URL=${NINEROUTER_GATEWAY_URL:-http://host.docker.internal:20128/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-9router-local}
      - MODEL=${HERMES_MODEL:-hermes-3-llama-3.1-8b}
    volumes:
      # Persistensi data internal & sesi Hermes
      - ./data:/opt/data
      - ./workspace:/opt/workspace
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 300
    extra_hosts:
      # Mengizinkan container mengakses 9router yang berjalan di host Linux
      - "host.docker.internal:host-gateway"
    command: gateway run

networks:
  default:
    name: gasken-hermes-net
    driver: bridge
