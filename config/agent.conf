# ==============================================================================
# GaskenLE - Konfigurasi Lingkungan AI Agent & Router (Defaults)
# Nilai-nilai di sini dapat di-override secara dinamis & privat melalui file .env
# ==============================================================================

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
WORKSPACE_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"

# --- HERMES AGENT (DOCKER) ---
# Menggunakan folder internal hermes/ di dalam project secara default
HERMES_DIR="${HERMES_DIR:-$WORKSPACE_ROOT/hermes}"
HERMES_CONTAINER_NAME="${HERMES_CONTAINER_NAME:-gasken-hermes}"
HERMES_PORT="${HERMES_PORT:-6666}"
HERMES_MODEL="${HERMES_MODEL:-hermes-3-llama-3.1-8b}"

# --- 9ROUTER AGENTIC AI ---
# Menggunakan folder internal 9router/ di dalam project secara default,
# atau menggunakan CUSTOM_NINEROUTER_DIR jika pengguna mengisinya di .env
NINEROUTER_DIR="${CUSTOM_NINEROUTER_DIR:-$WORKSPACE_ROOT/9router}"
NINEROUTER_PORT="${NINEROUTER_PORT:-20128}"
NINEROUTER_HOST="${NINEROUTER_HOST:-0.0.0.0}"
NINEROUTER_GATEWAY_URL="${NINEROUTER_GATEWAY_URL:-http://host.docker.internal:20128/v1}"

# --- MODE PELUNCURAN DEFAULT PANE 0 ---
# - "menu"     : Menu interaktif (Unified, 9router, Hermes, Shell)
# - "unified"  : Otomatis jalankan 9router Gateway + Sambungkan Hermes Agent
# - "hermes"   : Masuk langsung ke container Hermes
# - "9router"  : Jalankan 9router Gateway Server dengan log
# - "shell"    : Shell Bash biasa
DEFAULT_AGENT="${AGENT_MODE:-menu}"
